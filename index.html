<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PS STORE - مرسي مطروح</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ocean-blue: #0066cc;
      --cyan-glow: #00d2ff;
      --dark-bg: #060913;
      --panel-bg: #0f172a;
      --text-gray: #94a3b8;
      --white: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background-color: var(--dark-bg);
      background-image: linear-gradient(135deg, #060913 0%, #0c1b33 100%);
      color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .matrouh-wrapper {
      width: 92%;
      max-width: 480px;
      background: var(--panel-bg);
      border-radius: 14px;
      padding: 30px 20px;
      box-shadow: 0 15px 40px rgba(0, 102, 204, 0.3);
      border: 1px solid rgba(0, 210, 255, 0.2);
    }

    .header-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .store-logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--cyan-glow);
      letter-spacing: 3px;
      margin: 0;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .store-location {
      font-size: 15px;
      color: var(--text-gray);
      margin: 5px 0 15px;
      font-weight: 700;
    }

    .badges-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .badge-item {
      background: rgba(0, 102, 204, 0.15);
      color: var(--cyan-glow);
      border: 1px solid rgba(0, 102, 204, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .control-panel {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid var(--ocean-blue);
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 14px;
      color: var(--text-gray);
      margin-bottom: 8px;
    }

    .custom-select {
      width: 100%;
      padding: 12px;
      background: var(--dark-bg);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      margin-bottom: 15px;
      outline: none;
    }

    .radio-switcher {
      display: flex;
      background: var(--dark-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .radio-switcher input { display: none; }

    .radio-switcher label {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 600;
    }

    .radio-switcher input:checked + label {
      background: var(--ocean-blue);
      color: white;
    }

    .action-zone {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-sea {
      background: linear-gradient(135deg, var(--ocean-blue), #004080);
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-family: 'Cairo', sans-serif;
      font-weight: 900;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 102, 204, 0.4);
      transition: 0.3s;
    }

    .btn-sea:hover { opacity: 0.9; }

    .btn-outline {
      background: transparent;
      color: var(--text-gray);
      border: 1px solid var(--text-gray);
      padding: 10px;
      font-family: 'Cairo', sans-serif;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-outline:hover { color: white; border-color: white; }

    .tracker-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .tracker-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .percentage-val {
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      color: var(--cyan-glow);
    }

    .tracker-bar {
      width: 100%;
      height: 6px;
      background: var(--dark-bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .tracker-fill {
      height: 100%;
      background: var(--cyan-glow);
      transition: width 0.3s ease;
    }

    .log-btn {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 12px;
      width: 100%;
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      text-decoration: underline;
    }

    .terminal-log {
      display: none;
      background: #000;
      color: var(--cyan-glow);
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      height: 90px;
      overflow-y: auto;
      direction: ltr;
      text-align: left;
    }

    .store-footer {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
    }

    .footer-name {
      font-weight: 900;
      color: var(--cyan-glow);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .footer-details {
      font-size: 12px;
      color: var(--text-gray);
      line-height: 1.6;
    }

    .phone {
      color: white;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="matrouh-wrapper">
    <div class="header-section">
      <h1 class="store-logo">PS STORE</h1>
      <p class="store-location">مرسي مطروح</p>
      
      <div class="badges-row">
        <span class="badge-item">FW 7.00 - 13.52</span>
        <span class="badge-item">Auto Exploit</span>
      </div>
    </div>

    <div class="control-panel">
      <div class="input-group">
        <label class="input-label">اختر إصدار السوفت وير:</label>
        <select id="fw-select" class="custom-select">
          <option value="11.00">11.00</option>
          <option value="12.00">12.00</option>
          <option value="13.00">13.00</option>
          <option value="13.50">13.50</option>
          <option value="13.52">13.52</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">أداة التعديل:</label>
        <div class="radio-switcher">
          <input type="radio" id="exploit-lapse" name="exploit" value="lapse" checked>
          <label for="exploit-lapse">Lapse</label>
        </div>
      </div>
    </div>

    <div class="action-zone">
      <button id="btn-jailbreak" class="btn-sea" onclick="startJailbreak()">
        تفعيــل التعديلــة ⚡
      </button>
      <button class="btn-outline" onclick="alert('تم الحفظ للاستخدام أوفلاين!')">حفظ أوفلاين</button>
    </div>

    <div class="tracker-box">
      <div class="tracker-info">
        <span id="status-text">جاهز لبدء العملية...</span>
        <span id="status-percentage" class="percentage-val">0%</span>
      </div>
      <div class="tracker-bar">
        <div id="progress-bar" class="tracker-fill" style="width: 0%;"></div>
      </div>
      <button class="log-btn" onclick="toggleDebug()">سجل العمليات ⚙️</button>
      <div id="console" class="terminal-log"></div>
    </div>

    <footer class="store-footer">
      <div class="footer-name">PS STORE - مطروح</div>
      <div class="footer-details">
        العنوان: علم الروم - أمام فرع اتصالات<br>
        <span class="phone">ت/ 01001089207</span>
      </div>
    </footer>
  </div>

  <script>
    var exploitChain = "lapse";
    
    function startJailbreak() {
      document.getElementById('status-text').innerText = "جاري تفعيل الثغرة...";
      document.getElementById('progress-bar').style.width = "40%";
      document.getElementById('status-percentage').innerText = "40%";
      
      var fw = document.getElementById('fw-select').value;
      sessionStorage.setItem("lp_target_fw", fw);
      
      try {
        if (typeof doJb === "function") {
          doJb();
        } else {
          formatLog("Error: Main exploit function not found.");
        }
      } catch (err) {
        formatLog("Exception: " + err.message);
      }
    }

    function toggleDebug() {
      var consoleDiv = document.getElementById('console');
      consoleDiv.style.display = consoleDiv.style.display === 'block' ? 'none' : 'block';
    }

    function formatLog(msg) {
      var consoleDiv = document.getElementById('console');
      consoleDiv.innerText += "\n> " + msg;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }
  </script>

  <!-- مسارات السكربتات الأساسية (مرفوعة مباشرة في الصفحة الرئيسية) -->
  <script src="utils.mjs" type="module"></script>
  <script src="constants.js"></script>
  <script src="userland.js"></script>
  <script src="kernel.js"></script>
  <script src="mem.js"></script>
  <script src="jb.js"></script>
  <script src="loader.js"></script>
  <script src="workers.js"></script>
  <script src="lapse.js"></script>
  <script src="main.js"></script>

</body>
</html>
